plugins {
    id 'com.android.application'
}

// ---------------- 版本号（手动指定） ----------------
// 规则：版本号由开发者手动维护，需要发版时改这里即可，不做任何自动递增
def appVersionCode = 3
def appVersionName = "1.0.3"

android {
    namespace 'com.example.qrcodecleaner'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.qrcodecleaner"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file('../qrcode-release.jks')
            storePassword 'qrcode2026'
            keyAlias 'release'
            keyPassword 'qrcode2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // ML Kit 条码识别（内嵌模型，不依赖 Play Services），GPU/NNAPI 加速
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // ZXing 核心库，作为 ML Kit 识别失败时的兜底
    implementation 'com.google.zxing:core:3.5.3'
}

// 对齐 Kotlin stdlib 版本，避免 kotlin-stdlib-jdk7/jdk8 新旧版本重复类冲突
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}
